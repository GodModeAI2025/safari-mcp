name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # שינוי התנהגותי בקוד המקור חייב רשומת CHANGELOG — אחרת התיקון נשלח בלי שאף אחד יראה אותו
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Behavioural change requires a CHANGELOG entry
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [[ ",$LABELS," == *",skip-changelog,"* ]]; then
            echo "skip-changelog label present — skipping"; exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          src=$(echo "$changed" | grep -E '^(index|safari|mcp-helpers|transport)\.js$' || true)
          if [[ -z "$src" ]]; then
            echo "no source change — skipping"; exit 0
          fi
          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated ✓"; exit 0
          fi
          echo "::error::This PR changes $(echo "$src" | tr '\n' ' ')but not CHANGELOG.md."
          echo "Add an entry under [Unreleased], or apply the 'skip-changelog' label if the change is not user-visible."
          exit 1

  build:
    runs-on: macos-latest

    strategy:
      # One transient npm 503 on 09-04 cancelled the two sibling jobs that would have passed
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      # The audit endpoint is a network call to registry.npmjs.org. A 503 from it says
      # nothing about our dependencies — retry that; fail only on a real finding.
      - name: Audit production dependencies (fail on high+)
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if npm audit --audit-level=high --omit=dev 2>&1 | tee audit.log; then exit 0; fi
            grep -q "audit endpoint returned an error" audit.log || exit 1
            echo "npm audit endpoint unavailable (attempt $attempt/3) — retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Verify syntax of entry points
        run: |
          node --check index.js
          node --check safari.js
          node --check mcp-helpers.js

      # Full lint gate. The backlog that used to limit this to `no-undef` is cleared; the
      # narrow gate existed because v2.16.2 shipped a module-scope reference to a
      # function-local `server` that killed the startup banner for three days. The full
      # run catches that class too, plus everything else, and keeps the tree at zero.
      - name: Lint
        run: npx eslint . --max-warnings 0

      - run: npm test
